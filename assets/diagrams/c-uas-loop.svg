<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d">
  <title id="t">The counter-UAS loop</title>
  <desc id="d">Radar, passive RF and electro-optical or infrared sensors feed detection. The loop runs detect, track, identify, decide, defeat, assess, and back to detect. A jammer is one option inside the defeat stage only.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow  { stroke-dasharray: 6 6; animation: flow 3s linear infinite; }
    .feed  { stroke-dasharray: 4 5; animation: flow 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -48 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <rect width="1200" height="450" fill="#F5F7FA"/>
  <text x="48" y="52" class="mono" font-size="12" letter-spacing="1.2" fill="#6B7688">NOTE 01  ·  THE COUNTER-UAS LOOP (CONCEPTUAL)</text>
  <text x="48" y="94" class="display" font-size="26" font-weight="600" fill="#0E1726">A sensing-and-decision loop with an effector on the end</text>

  <!-- sensor layers -->
  <g class="mono" font-size="12">
    <rect x="48" y="126" width="96" height="32" rx="4" fill="#EEF2F5" stroke="#3E5C76" stroke-width="1.5"/>
    <text x="72" y="147" fill="#0E1726">RADAR</text>
    <rect x="156" y="126" width="120" height="32" rx="4" fill="#EEF2F5" stroke="#3E5C76" stroke-width="1.5"/>
    <text x="174" y="147" fill="#0E1726">PASSIVE RF</text>
    <rect x="288" y="126" width="96" height="32" rx="4" fill="#EEF2F5" stroke="#3E5C76" stroke-width="1.5"/>
    <text x="310" y="147" fill="#0E1726">EO / IR</text>
    <text x="400" y="147" fill="#6B7688">overlapping sensors cover each other's blind spots</text>
  </g>
  <g fill="none" stroke="#3E5C76" stroke-width="1.5">
    <path class="feed" d="M96,158 L112,214"/>
    <path class="feed" d="M216,158 L136,214"/>
    <path class="feed" d="M336,158 L150,214"/>
  </g>

  <!-- loop path -->
  <path class="flow" d="M128,262 L1088,262 M1088,306 L1088,386 L128,386 L128,306" fill="none" stroke="#3E5C76" stroke-width="1.75"/>

  <!-- stages -->
  <g>
    <rect x="48" y="216" width="160" height="90" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="48" y="216" width="160" height="3" fill="#0B2545"/>
    <text x="64" y="244" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">01  DETECT</text>
    <text x="64" y="290" class="sans" font-size="14" fill="#0E1726">is something there?</text>

    <rect x="240" y="216" width="160" height="90" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="240" y="216" width="160" height="3" fill="#0B2545"/>
    <text x="256" y="244" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">02  TRACK</text>
    <text x="256" y="290" class="sans" font-size="14" fill="#0E1726">where is it going?</text>

    <rect x="432" y="216" width="160" height="90" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="432" y="216" width="160" height="3" fill="#0B2545"/>
    <text x="448" y="244" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">03  IDENTIFY</text>
    <text x="448" y="290" class="sans" font-size="14" fill="#0E1726">what, and whose?</text>

    <rect x="624" y="216" width="160" height="90" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="624" y="216" width="160" height="3" fill="#0B2545"/>
    <text x="640" y="244" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">04  DECIDE</text>
    <text x="640" y="290" class="sans" font-size="14" fill="#0E1726">authority, rules</text>

    <rect x="816" y="216" width="160" height="90" rx="4" fill="#fff" stroke="#8A6A1F" stroke-width="1.5"/>
    <rect x="816" y="216" width="160" height="3" fill="#8A6A1F"/>
    <text x="832" y="244" class="mono" font-size="12" letter-spacing="1" fill="#8A6A1F">05  DEFEAT</text>
    <text x="832" y="290" class="sans" font-size="14" fill="#0E1726">soft to hard effect</text>

    <rect x="1008" y="216" width="160" height="90" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="1008" y="216" width="160" height="3" fill="#0B2545"/>
    <text x="1024" y="244" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">06  ASSESS</text>
    <text x="1024" y="290" class="sans" font-size="14" fill="#0E1726">did it work?</text>
  </g>

  <!-- jammer note -->
  <line x1="896" y1="306" x2="896" y2="336" stroke="#8A6A1F" stroke-width="1.5" stroke-opacity=".7"/>
  <text x="906" y="334" class="mono" font-size="12" fill="#8A6A1F">a jammer is one option, here only</text>

  <text x="140" y="378" class="mono" font-size="12" fill="#6B7688">loop repeats until the airspace is clear</text>
  <text x="48" y="428" class="sans" font-size="14" fill="#3D4A5C">A drone on a pre-programmed route with its radio quiet has no link to jam; detection and fusion carry the loop.</text>

  <circle r="6" fill="#0B2545" stroke="#fff" stroke-width="1.5">
    <animateMotion dur="9s" repeatCount="indefinite" path="M128,262 L1088,262 L1088,386 L128,386 Z"/>
  </circle>
</svg>
