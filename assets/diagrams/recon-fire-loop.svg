<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
  <title id="t">The reconnaissance-fire loop and where a defender can act</title>
  <desc id="d">Observer drone, link and ground station, decision point and fire asset form a loop. Under each stage, a defender action: detect and track the observer, locate the ground station, degrade the link, conceal the scene. A timeline compares the adversary loop time with the defender's detect-to-effect time; the difference is the decision margin.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow  { stroke-dasharray: 6 6; animation: flow 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -48 } }
    .grow  { transform-box: fill-box; transform-origin: left center; animation: grow 6s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0.3) } 60%, 100% { transform: scaleX(1) } }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <rect width="1200" height="500" fill="#F5F7FA"/>
  <text x="48" y="52" class="mono" font-size="12" letter-spacing="1.2" fill="#5F6B7C">NOTE 05  ·  THE RECONNAISSANCE-FIRE LOOP (CONCEPTUAL)</text>
  <text x="48" y="92" class="display" font-size="26" font-weight="600" fill="#0E1726">The threat is the loop; every stage is a place to act</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#3E5C76" stroke-width="1.6"/></marker></defs>

  <g transform="translate(0 30)">
  <!-- loop stages -->
  <g class="sans" font-size="15" fill="#0E1726">
    <rect x="48"  y="128" width="230" height="70" rx="4" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.5"/>
    <text x="163" y="158" text-anchor="middle" font-weight="600">Observer drone</text>
    <text x="163" y="180" text-anchor="middle" class="mono" font-size="12" fill="#5F6B7C">loiters, watches, reports</text>
    <rect x="338" y="128" width="230" height="70" rx="4" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.5"/>
    <text x="453" y="158" text-anchor="middle" font-weight="600">Link and ground station</text>
    <text x="453" y="180" text-anchor="middle" class="mono" font-size="12" fill="#5F6B7C">operator well back, emitting</text>
    <rect x="628" y="128" width="230" height="70" rx="4" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.5"/>
    <text x="743" y="158" text-anchor="middle" font-weight="600">Decision</text>
    <text x="743" y="180" text-anchor="middle" class="mono" font-size="12" fill="#5F6B7C">one area, shared data</text>
    <rect x="918" y="128" width="230" height="70" rx="4" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.5"/>
    <text x="1033" y="158" text-anchor="middle" font-weight="600">Fire asset</text>
    <text x="1033" y="180" text-anchor="middle" class="mono" font-size="12" fill="#5F6B7C">any unit that can act</text>
  </g>
  <g fill="none" stroke="#3E5C76" stroke-width="1.6">
    <line x1="278" y1="163" x2="336" y2="163" class="flow" marker-end="url(#ar)"/>
    <line x1="568" y1="163" x2="626" y2="163" class="flow" marker-end="url(#ar)"/>
    <line x1="858" y1="163" x2="916" y2="163" class="flow" marker-end="url(#ar)"/>
    <path d="M1033 128 C 1033 100, 163 100, 163 126" class="flow" marker-end="url(#ar)"/>
  </g>
  <text x="598" y="104" text-anchor="middle" class="mono" font-size="11" fill="#5F6B7C">observer confirms the effect, loop repeats</text>

  <!-- defender actions -->
  <g class="sans" font-size="13" fill="#0E1726">
    <rect x="48"  y="232" width="230" height="56" rx="4" fill="#E9F2F2" stroke="#2F6F73" stroke-width="1.5"/>
    <text x="163" y="256" text-anchor="middle" font-weight="600">Detect and track</text>
    <text x="163" y="276" text-anchor="middle" class="mono" font-size="11" fill="#2F6F73">radar · EO/IR · passive RF</text>
    <rect x="338" y="232" width="230" height="56" rx="4" fill="#E9F2F2" stroke="#2F6F73" stroke-width="1.5"/>
    <text x="453" y="256" text-anchor="middle" font-weight="600">Locate and degrade</text>
    <text x="453" y="276" text-anchor="middle" class="mono" font-size="11" fill="#2F6F73">find the operator · multi-band</text>
    <rect x="628" y="232" width="230" height="56" rx="4" fill="#E9F2F2" stroke="#2F6F73" stroke-width="1.5"/>
    <text x="743" y="256" text-anchor="middle" font-weight="600">Deny certainty</text>
    <text x="743" y="276" text-anchor="middle" class="mono" font-size="11" fill="#2F6F73">decoys · ambiguity</text>
    <rect x="918" y="232" width="230" height="56" rx="4" fill="#E9F2F2" stroke="#2F6F73" stroke-width="1.5"/>
    <text x="1033" y="256" text-anchor="middle" font-weight="600">Conceal the scene</text>
    <text x="1033" y="276" text-anchor="middle" class="mono" font-size="11" fill="#2F6F73">signature discipline</text>
  </g>
  <g stroke="#2F6F73" stroke-width="1.2" stroke-dasharray="3 4">
    <line x1="163" y1="198" x2="163" y2="230"/><line x1="453" y1="198" x2="453" y2="230"/>
    <line x1="743" y1="198" x2="743" y2="230"/><line x1="1033" y1="198" x2="1033" y2="230"/>
  </g>

  <!-- timeline -->
  <text x="48" y="336" class="mono" font-size="12" letter-spacing="1" fill="#5F6B7C">THE CLOCK (ILLUSTRATIVE, NO REAL VALUES)</text>
  <text x="48" y="370" class="sans" font-size="13" fill="#3D4A5C">Adversary: observe → engage</text>
  <rect x="300" y="356" width="760" height="20" rx="3" fill="#EDF1F6" stroke="#0B2545" stroke-width="1.2"/>
  <text x="48" y="412" class="sans" font-size="13" fill="#3D4A5C">Defender: detect → effect</text>
  <rect x="300" y="398" width="470" height="20" rx="3" fill="#E9F2F2" stroke="#2F6F73" stroke-width="1.2" class="grow"/>
  <line x1="770" y1="392" x2="770" y2="428" stroke="#8A6A1F" stroke-width="1.5"/>
  <line x1="1060" y1="350" x2="1060" y2="428" stroke="#8A6A1F" stroke-width="1.5"/>
  <line x1="772" y1="436" x2="1058" y2="436" stroke="#8A6A1F" stroke-width="1.5" class="pulse"/>
  <text x="915" y="456" text-anchor="middle" class="mono" font-size="12" fill="#8A6A1F">decision margin: the loop never closes</text>
  </g>
</svg>
