<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Field Research</title>
  <desc id="d">A vessel track reported over AIS goes dark; the search area grows from the last fix, a radar return with no matching AIS appears inside it, and the track resumes. Cooperative and non-cooperative sources fused.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lane  { stroke-dasharray: 2 6; animation: flow 10s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -80 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <rect width="1200" height="400" fill="#F5F7FA"/>
  <rect x=".5" y=".5" width="1199" height="399" fill="none" stroke="#D8DEE6"/>

  <text x="64" y="82" class="mono" font-size="12" letter-spacing="1.8" fill="#5F6B7C">DARKANALYTICA</text>
  <rect x="64" y="108" width="48" height="3" fill="#0B2545"/>
  <text x="62" y="176" class="display" font-size="46" font-weight="600" fill="#0E1726">Field Research</text>
  <text x="64" y="226" class="sans" font-size="19" fill="#3D4A5C">Short, sourced case studies in counter-UAS, RF,</text>
  <text x="64" y="252" class="sans" font-size="19" fill="#3D4A5C">satellite navigation and maritime OSINT.</text>
  <text x="64" y="330" class="mono" font-size="12" letter-spacing="1.2" fill="#5F6B7C">OPEN SOURCES  ·  COUNTER-UAS  ·  RF  ·  GNSS  ·  OSINT</text>

  <line x1="680" y1="56" x2="680" y2="344" stroke="#D8DEE6"/>

  <g>
    <path class="lane" d="M712,120 C820,110 960,90 1168,70" fill="none" stroke="#3E5C76" stroke-width="1.5" stroke-opacity=".45"/>
    <path class="lane" d="M712,320 C860,300 1000,290 1168,250" fill="none" stroke="#3E5C76" stroke-width="1.5" stroke-opacity=".45"/>

    <circle cx="880" cy="215" r="90" fill="#F4EFE2" fill-opacity=".7" stroke="#B7791F" stroke-width="1.5" stroke-dasharray="5 4">
      <animate attributeName="r" dur="8s" repeatCount="indefinite" values="6;90;90;6" keyTimes="0;0.7;0.95;1"/>
    </circle>

    <g fill="#0B2545">
      <circle cx="722" cy="290" r="4"/>
      <circle cx="762" cy="270" r="4"/>
      <circle cx="802" cy="252" r="4"/>
      <circle cx="842" cy="233" r="4"/>
    </g>
    <circle cx="880" cy="215" r="6" fill="#fff" stroke="#0B2545" stroke-width="2"/>

    <path d="M880,215 L938,184 L1010,150" fill="none" stroke="#8A6A1F" stroke-width="1.75" stroke-dasharray="4 4">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5;0.6;0.95;1"/>
    </path>

    <g>
      <rect x="932" y="178" width="12" height="12" fill="#8A6A1F"/>
      <text x="952" y="196" class="mono" font-size="12" fill="#8A6A1F">RADAR, NO AIS</text>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.42;0.46;0.95;1"/>
    </g>

    <g fill="#0B2545">
      <circle cx="1010" cy="150" r="4"/>
      <circle cx="1052" cy="132" r="4"/>
      <circle cx="1094" cy="114" r="4"/>
      <circle cx="1136" cy="96" r="4"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7;0.76;0.95;1"/>
    </g>

    <text x="720" y="312" class="mono" font-size="12" fill="#0B2545">AIS</text>
    <text x="826" y="248" class="mono" font-size="12" fill="#0B2545">LAST FIX</text>
    <text x="966" y="318" class="mono" font-size="12" fill="#875A16">SEARCH AREA</text>
    <text x="712" y="352" class="mono" font-size="12" fill="#5F6B7C">COOPERATIVE  ·  NON-COOPERATIVE  ·  FUSED</text>
  </g>
</svg>
